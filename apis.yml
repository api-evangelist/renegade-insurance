aid: renegade-insurance
name: Renegade Insurance
description: 'Renegade Insurance is a property and casualty (P&C) insurance company
  built around independent agents. It runs an agency franchise network, acquires agencies
  and books of business, and manages books for agents who retain ownership, pairing
  a consumer shop-and-compare experience for home, auto, flood, cyber, commercial
  property and liability coverage with an internal agent platform for quoting, client
  tracking and reporting. Franchise agents work on Salesforce alongside Renegade''s
  own in-house tooling. The company was founded in 2018, is privately held, and its
  shares trade on secondary marketplaces. No public developer program, developer portal,
  or machine-readable API contract was found on any Renegade Insurance host.'
